<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Panda-Run" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Panda-Run</title>
    <meta name="description" content="Panda-Run — un RPG plateforme kawaii style Ragnarok : explore 58 terrains, combats, monte en niveau, débloque classes et sorts." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Panda-Run 🐼" />
    <meta property="og:description" content="Un RPG plateforme kawaii : explore, combats, monte en niveau, débloque classes et sorts." />
    <meta property="og:image" content="https://charlesreizine.github.io/panda-run/art/bg-share.png" />
    <meta property="og:url" content="https://charlesreizine.github.io/panda-run/" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
      html, body { position: fixed; inset: 0; width: 100%; height: 100%; }
      /* #game : conteneur de la zone visible. Dimensionné en CSS PUR, plus en JS.
         ─ dvw/dvh (« dynamic viewport ») suivent NATIVEMENT l'apparition et la disparition de la
           barre d'URL de Safari. C'est ce que main.ts essayait d'émuler en mesurant visualViewport
           puis en rejouant la mesure à 80/250/600/1200/2500 ms — une mesure JS est toujours périmée
           une frame plus tard, d'où le bas du jeu coupé sur iPhone.
         ─ INSETS SYMÉTRIQUES via max() : en paysage l'encoche n'est que d'UN côté, donc appliquer
           safe-area-inset-left à gauche et -right à droite rognait la largeur de façon asymétrique
           et DÉCENTRAIT le jeu. On prend le max des deux côtés → centrage préservé, encoche évitée.
         Le fallback 100%/100% sert aux navigateurs sans dvw/dvh (Safari < 15.4). */
      #game {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        width: 100dvw; height: 100dvh;
        box-sizing: border-box;
        padding-left: max(env(safe-area-inset-left), env(safe-area-inset-right));
        padding-right: max(env(safe-area-inset-left), env(safe-area-inset-right));
        padding-top: max(env(safe-area-inset-top), env(safe-area-inset-bottom));
        padding-bottom: max(env(safe-area-inset-top), env(safe-area-inset-bottom));
      }
      canvas { display: block; }

      /* Overlay « tourne ton téléphone » : le jeu est conçu en PAYSAGE (960×540). En
         portrait il deviendrait minuscule → on masque tout et on invite à pivoter.
         CSS pur, indépendant de Phaser : robuste sur tous les mobiles. */
      #rotate {
        display: none; /* paysage : masqué (défaut) */
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(160deg, #ffe1ec 0%, #ffd6a5 55%, #bde0fe 100%);
        color: #5a3b2e;
        text-align: center;
        flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      #rotate .rotate-emoji { font-size: 84px; line-height: 1; animation: rotate-wobble 1.8s ease-in-out infinite; }
      #rotate .rotate-title { font-size: 26px; font-weight: 800; letter-spacing: 0.3px; }
      #rotate .rotate-sub { font-size: 16px; font-weight: 600; opacity: 0.75; max-width: 18em; }
      @keyframes rotate-wobble {
        0%, 100% { transform: rotate(-18deg); }
        50% { transform: rotate(72deg); }
      }
      /* PORTRAIT uniquement : on affiche l'overlay (il recouvre le jeu). */
      @media (orientation: portrait) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-hidden="true">
      <div class="rotate-emoji">🔄</div>
      <div class="rotate-title">🐼 Tourne ton téléphone</div>
      <div class="rotate-sub">Panda-Run se joue en mode paysage. Mets ton téléphone à l'horizontale pour commencer&nbsp;!</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
