<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda-Run a déménagé</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d1b2a; color: #e1f5fe; display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { color: #ffd54f; font-size: 1.6rem; margin: 0 0 12px; }
  a.btn {
    display: inline-block; margin-top: 20px; padding: 14px 26px; border-radius: 10px;
    background: #2e7d32; color: #fff; font-weight: 700; text-decoration: none; font-size: 1.05rem;
  }
  p { line-height: 1.5; max-width: 34rem; }
  small { opacity: .65; display: block; margin-top: 22px; }
</style>
</head>
<body>
  <main>
    <h1>Panda-Run a déménagé 🐼</h1>
    <p>Le jeu est désormais ici, avec la sauvegarde en ligne :</p>
    <p><a class="btn" id="go" href="https://panda-run-reizine.web.app/">Jouer à Panda-Run</a></p>
    <small id="state">Nettoyage de l'ancienne version…</small>
  </main>
<script>
// Cette page remplace l'ancien déploiement gh-pages. Elle ne se contente PAS de rediriger : elle
// DÉMONTE d'abord la PWA de cette origine.
//
// Pourquoi c'est indispensable : l'ancien service worker était configuré en clientsClaim +
// skipWaiting et servait index.html depuis son cache. Sans désinscription, il continuerait à
// afficher l'ancienne build (R274) et cette page ne serait jamais vue. On désinscrit donc tous les
// service workers et on vide tous les caches AVANT de partir.
//
// À noter : la sauvegarde des joueurs vivait dans le localStorage de CETTE origine et ne peut pas
// être transférée automatiquement (localStorage est cloisonné par origine). Choix assumé.
(async () => {
  const state = document.getElementById('state')
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations()
      await Promise.all(regs.map((r) => r.unregister()))
    }
    if (window.caches) {
      const keys = await caches.keys()
      await Promise.all(keys.map((k) => caches.delete(k)))
    }
    state.textContent = 'Ancienne version désinstallée. Redirection…'
  } catch (e) {
    state.textContent = 'Redirection…'
  }
  // petit délai pour que le message soit lisible, et que la désinscription soit bien effective
  setTimeout(() => { location.replace('https://panda-run-reizine.web.app/') }, 1200)
})()
</script>
</body>
</html>
